AWSTemplateFormatVersion: '2010-09-09'
Description: CineGraph E4 - S3 privado y Security Groups en VPC existente (sin EC2/RDS).

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC existente validada en AWS Academy.

Resources:
  DataLakeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'cinegraph-e4-datalake-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: cinegraph-e4-datalake
        - Key: Project
          Value: CineGraph
        - Key: Team
          Value: E4
        - Key: Environment
          Value: lab

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: cinegraph-e4-app-sg
      GroupDescription: Application SG; web ingress configured later with HTTPS.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: cinegraph-e4-app-sg
        - Key: Project
          Value: CineGraph

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: cinegraph-e4-rds-sg
      GroupDescription: PostgreSQL inbound only from CineGraph application SG.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: PostgreSQL from app SG only.
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
      Tags:
        - Key: Name
          Value: cinegraph-e4-rds-sg
        - Key: Project
          Value: CineGraph

Outputs:
  BucketName:
    Value: !Ref DataLakeBucket
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup
  VpcId:
    Value: !Ref VpcId

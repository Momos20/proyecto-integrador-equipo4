services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recommender
      POSTGRES_USER: recommender
      POSTGRES_PASSWORD: recommender
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommender -d recommender"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema/001_init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/schema/002_views.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
      - ./database/schema/003_user_interactions.sql:/docker-entrypoint-initdb.d/03_interactions.sql:ro
      # No se cargan seeds simulados en nuevas bases.

  app:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://recommender:recommender@db:5432/recommender
      CLICKSTREAM_LOG_PATH: /app/logs/clickstream.log
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - clickstream_logs:/app/logs
      - cinegraph_session_keys:/app/session-secrets

  local-setup:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://recommender:recommender@db:5432/recommender
      CINEGRAPH_LOCAL_SETUP: "1"
      # Ejecutar scripts montados en /app/scripts desde el directorio /app.
      PYTHONPATH: /app
    volumes:
      - ./database/migrations:/app/database/migrations:ro
      - ./scripts/local_setup:/app/scripts/local_setup:ro
      - ./data/reference/movielens32m:/app/data/reference/movielens32m:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python"]
    command: ["/app/scripts/local_setup/bootstrap.py"]

  kinesis-agent:
    profiles: ["aws-streaming"]
    build:
      context: .
      dockerfile: infrastructure/docker/kinesis-agent.Dockerfile
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      KINESIS_STREAM_NAME: ${KINESIS_STREAM_NAME:-cinegraph-clickstream}
    volumes:
      - clickstream_logs:/var/log/cinegraph:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  clickstream_logs:
  cinegraph_session_keys:

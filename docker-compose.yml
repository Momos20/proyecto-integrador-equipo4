services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recommender
      POSTGRES_USER: recommender
      POSTGRES_PASSWORD: recommender
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recommender -d recommender"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema/001_init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/schema/002_views.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
      - ./database/schema/003_user_interactions.sql:/docker-entrypoint-initdb.d/03_interactions.sql:ro
      - ./database/seeds/001_mock_data.sql:/docker-entrypoint-initdb.d/04_seed.sql:ro

  app:
    build:
      context: .
      dockerfile: infrastructure/docker/app.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://recommender:recommender@db:5432/recommender
      CLICKSTREAM_LOG_PATH: /app/logs/clickstream.log
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - clickstream_logs:/app/logs

  # Optional locally; enabled on the AWS EC2 deployment with:
  # docker compose --profile aws-streaming up -d kinesis-agent
  kinesis-agent:
    profiles: ["aws-streaming"]
    build:
      context: .
      dockerfile: infrastructure/docker/kinesis-agent.Dockerfile
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      KINESIS_STREAM_NAME: ${KINESIS_STREAM_NAME:-cinegraph-clickstream}
    volumes:
      - clickstream_logs:/var/log/cinegraph:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  clickstream_logs:
